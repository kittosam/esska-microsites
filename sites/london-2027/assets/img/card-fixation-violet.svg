<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#443566"/><stop offset=".55" stop-color="#2B2148"/><stop offset="1" stop-color="#120D22"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="44%" r="55%">
    <stop offset="0" stop-color="#9C8ED4" stop-opacity=".24"/><stop offset="1" stop-color="#9C8ED4" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F6F4FC"/><stop offset=".6" stop-color="#D3CBEC"/><stop offset="1" stop-color="#8174B4"/>
  </linearGradient>
</defs>
<rect width="800" height="900" fill="url(#bg)"/><rect width="800" height="900" fill="url(#glow)"/>
<g stroke="#9C8ED4" stroke-opacity=".12" stroke-width="1"><path d="M0 300h800M0 600h800M266 0v900M533 0v900"/></g>

<!-- the right ankle from the front: tibia, talus and fibula -->
<!-- tibia, with the medial malleolus -->
<path d="M250 -10H470C472 150 480 300 500 380C510 420 520 450 516 470L300 470C296 500 292 540 280 566C272 584 246 584 240 566C226 520 222 450 232 380C244 300 250 150 250 -10Z" fill="url(#bone)" opacity=".95"/>
<!-- talus, sitting in the mortise -->
<path d="M300 486C336 470 478 470 516 486C536 498 538 540 528 570C514 618 470 648 410 648C350 648 312 618 298 580C288 550 288 504 300 486Z" fill="url(#bone)" opacity=".8"/>
<!-- fibula, with the lateral malleolus -->
<path d="M548 -10H588C590 200 596 360 606 440C616 500 612 560 590 600C576 622 548 620 540 596C530 560 532 500 536 440C542 360 546 200 548 -10Z" fill="url(#bone)" opacity=".9"/>

<!-- suture-button fixation across the syndesmosis -->
<path d="M226 400H614" stroke="#E5E0F4" stroke-width="7" stroke-linecap="round"/>
<rect x="210" y="378" width="16" height="44" rx="8" fill="#E5E0F4"/>
<rect x="614" y="378" width="16" height="44" rx="8" fill="#E5E0F4"/>
<circle cx="622" cy="400" r="34" fill="none" stroke="#9C8ED4" stroke-opacity=".6" stroke-width="3"/>

</svg>
