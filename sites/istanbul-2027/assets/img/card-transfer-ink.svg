  <circle cx="256" cy="188" r="13" fill="#8A7350"/>
</g>
<text x="150" y="666" fill="#CBB595" font-family="Onest,system-ui,sans-serif" font-size="26" font-weight="700" letter-spacing="3">BEFORE</text>

<!-- the move -->
