<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bgk" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#14161C"/><stop offset=".55" stop-color="#2A2118"/><stop offset="1" stop-color="#07080B"/>
  </linearGradient>
  <radialGradient id="warm" cx="50%" cy="38%" r="58%">
    <stop offset="0" stop-color="#E3C078" stop-opacity=".22"/><stop offset="1" stop-color="#E3C078" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bn" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F3E6CE"/><stop offset=".65" stop-color="#CBB595"/><stop offset="1" stop-color="#8A7350"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F6DEAF"/><stop offset=".55" stop-color="#E3C078"/><stop offset="1" stop-color="#A9803C"/>
  </linearGradient>
