<rect width="800" height="900" fill="url(#bgk)"/><rect width="800" height="900" fill="url(#warm)"/>
<g stroke="#E3C078" stroke-opacity=".12" stroke-width="1"><path d="M0 300h800M0 600h800M266 0v900M533 0v900"/></g>

