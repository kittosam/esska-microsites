<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1A5A63"/><stop offset=".55" stop-color="#0F4047"/><stop offset="1" stop-color="#061D21"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="42%" r="55%">
    <stop offset="0" stop-color="#A6D8C5" stop-opacity=".22"/><stop offset="1" stop-color="#A6D8C5" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F0F4F1"/><stop offset=".6" stop-color="#C3DDD2"/><stop offset="1" stop-color="#6F9C92"/>
  </linearGradient>
  <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D6F0E5"/><stop offset=".55" stop-color="#A6D8C5"/><stop offset="1" stop-color="#3E9C7D"/>
  </linearGradient>
</defs>
<rect width="800" height="900" fill="url(#bg)"/><rect width="800" height="900" fill="url(#glow)"/>
<g stroke="#A6D8C5" stroke-opacity=".1" stroke-width="1"><path d="M0 300h800M0 600h800M266 0v900M533 0v900"/></g>

<!-- the right knee from the front: femur, tibia and fibula -->
<g>
  <!-- femur: shaft widening into the two condyles -->
  <path d="M342 -10h116c4 90 10 170 40 230 26 50 70 82 78 136 6 42-16 76-58 82-30 4-52-10-66-30-10-14-24-14-34 0-16 22-40 36-72 30-44-8-62-44-54-86 10-54 52-84 76-132 28-60 30-140 34-230z" fill="url(#bone)" opacity=".95"/>
  <!-- tibia: plateau and shaft -->
  <path d="M232 482c10-20 40-28 84-28h168c46 0 76 8 86 28 10 20-6 42-40 56-40 16-58 40-62 90l-14 290H350l-14-290c-4-50-22-74-62-90-34-14-52-36-42-56z" fill="url(#bone)" opacity=".92"/>
  <!-- fibula, on the lateral side -->
  <path d="M556 540c16-6 30 0 32 16l-8 360h-26l-6-354c0-10 2-18 8-22z" fill="url(#bone)" opacity=".7"/>
</g>

<!-- lateral extra-articular tenodesis: a strip from the lateral femur down to the tibia -->
<g>
  <path d="M520 300c40 40 56 110 50 196" stroke="url(#mint)" stroke-width="16" fill="none" stroke-linecap="round"/>
  <circle cx="520" cy="300" r="12" fill="#D6F0E5"/>
  <circle cx="570" cy="498" r="12" fill="#D6F0E5"/>
  <circle cx="570" cy="498" r="24" fill="none" stroke="#A6D8C5" stroke-opacity=".55" stroke-width="3"/>
</g>

<!-- the rotation the procedure controls: an arc around the tibia -->
<g stroke="#A6D8C5" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M214 612c40 34 110 50 186 50s150-18 190-54" stroke-dasharray="2 16" stroke-opacity=".75"/>
  <path d="M590 608c14-12 22-26 22-40"/>
  <path d="M592 572l20-6 8 20"/>
</g>
</svg>
